<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css'>
<link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css'>
<script defer src='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js'></script>
<script defer src='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js'></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    renderMathInElement(document.body, {
        delimiters: [
            {left: '', right: '', display: true},
            {left: '$', right: '$', display: false},
            {left: '$', right: '$', display: false}
        ],
        throwOnError: false
    });
});
</script>
</head>
<body class='markdown-body' style='padding: 30px;'>
<h3>Проверка GitHub backtick math</h3>
<ul>
  <li>Формула: $\text{VV}_{\text{dB}} = 10 \log_{10}(\sigma^0_{\text{VV}})$, $\text{VH}_{\text{dB}} = 10 \log_{10}(\sigma^0_{\text{VH}})$</li>
  <li>Отношение: $\text{ratio}_{\text{dB}} = \text{VV}_{\text{dB}} - \text{VH}_{\text{dB}}$</li>
</ul>
</body>
</html>
